name: usb_host_proxy
description: API declarations for Android USB Host and Windows USB pipe extensions. No platform implementation yet.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.1.0
dev_dependencies:
  jnigen: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.jarekxxxxx.usb_host_proxy
        pluginClass: UsbHostProxyPlugin