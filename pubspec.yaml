name: usb_host_proxy
description: Android USB Host management through JNI. Data transport and the Windows backend are not implemented.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  jni: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  jnigen: ^1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.jarekxxxxx.usb_host_proxy
        pluginClass: UsbHostProxyPlugin
