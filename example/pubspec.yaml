name: usb_host_proxy_example
description: Manual Android USB Host diagnostics using the public usb_host_proxy API, without data transfers.
publish_to: none
version: 0.3.1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  usb_host_proxy:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  jni: ^1.1.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
